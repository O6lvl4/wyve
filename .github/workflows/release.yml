name: release-binaries
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest      # x86_64-linux
          - os: ubuntu-24.04-arm   # aarch64-linux
          - os: macos-13           # x86_64-darwin
          - os: macos-latest       # arm64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          distribution: full
          variant: CS
          version: stable
      - name: install wyve
        run: raco pkg install --batch --auto --link -n wyve ./racket
      - name: build standalone wyvec
        run: bash scripts/make-dist.sh
      - name: package
        run: |
          name=$(ls dist | head -1)
          tar -czf "wyvec-${GITHUB_REF_NAME}-${name#wyvec-}.tar.gz" -C dist "$name"
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" wyvec-*.tar.gz --clobber
