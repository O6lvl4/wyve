name: release-binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to attach binaries to
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # x86_64-linux
            arch: x64
          - os: ubuntu-24.04-arm   # aarch64-linux: no official Racket
            arch: arm64            # installer -> apt
            racket: apt
          - os: macos-13           # x86_64-darwin
            arch: x64
          - os: macos-latest       # arm64-darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        if: matrix.racket != 'apt'
        with:
          architecture: ${{ matrix.arch }}
          distribution: full
          variant: CS
          version: stable
      - name: setup racket (apt)
        if: matrix.racket == 'apt'
        run: sudo apt-get update && sudo apt-get install -y racket
      - name: install wyve
        run: raco pkg install --batch --auto --link -n wyve ./racket
      - name: build standalone wyvec
        run: bash scripts/make-dist.sh
      - name: package
        run: |
          name=$(ls dist | head -1)
          tar -czf "wyvec-${RELEASE_TAG}-${name#wyvec-}.tar.gz" -C dist "$name"
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" wyvec-*.tar.gz --clobber

  dist-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - name: build standalone wyvec.exe
        shell: bash
        run: |
          raco pkg install --batch --auto --link -n wyve ./racket
          raco exe -o wyvec racket/cli.rkt
          raco distribute wyvec-windows-x86_64 wyvec.exe
          ./wyvec-windows-x86_64/wyvec.exe check examples/saxpy.wyv
          tar -czf "wyvec-${RELEASE_TAG}-windows-x86_64.tar.gz" wyvec-windows-x86_64
      - name: attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" wyvec-*.tar.gz --clobber
